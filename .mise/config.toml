monorepo_root = true

[monorepo]
config_roots = ["web"]

[settings]
experimental = true
auto_env = true

[settings.cargo]
binstall = true
binstall_native = true

[env]
_.file = ".env"
_.path = ["{{ config_root }}/web/node_modules/.bin"]
RUST_BACKTRACE = "1"

[tools]
node = "26.10.0"
pnpm = "12.8.1"
rust = "1.98.1"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:crate-ci/typos" = "1.50.3"
"aqua:grafana/k6" = "2.3.0"

[tasks.rust-components]
description = "Build all of the released components of the workspace"
run = "rustup component add rustfmt clippy"

[tasks.build]
description = "Build all of the released components of the workspace"
run = "cargo build --package tactica-api --release"

[tasks.fmt]
description = "Run rustfmt on the entire workspace"
run = ["cargo fmt --all", "pnpm -C web run fmt", "taplo fmt"]

[tasks.fmt-check]
description = "Run rustfmt on the entire workspace"
run = ["cargo fmt --all -- --check", "taplo fmt --check"]

[tasks.clippy]
description = "Run rustfmt on the entire workspace"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.check]
description = "Run all CI checks locally"
depends = ["lint", "test", "doc", "audit"]

[tasks.lint]
description = "Run fmt, clippy, typos, taplo, machete"
run = [
  "cargo fmt --all -- --check",
  "pnpm -C web run fmt:check",
  "pnpm -C web run lint",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo machete",
  "taplo fmt --check",
  "typos",
]

[tasks.test]
description = "Run tests with nextest"
run = "cargo nextest run --workspace --all-features --no-fail-fast -E 'not binary(/^integration/)'"

[tasks.test-archive]
description = "Build test archive for CI"
run = '''
set -eu
mkdir -p target/nextest
cargo nextest archive --workspace --all-features --locked \
  --archive-file "{{ config_root }}/target/nextest/workspace.tar.zst"
cargo build --workspace --all-features --locked --bin tactica-api
cp "{{ config_root }}/target/debug/tactica-api" "{{ config_root }}/target/nextest/tactica-api"
'''

[tasks.test-from-archive]
description = "Run the hermetic suite from the archive `test-archive` built (no compile, no doctests)"
run = '''
cargo-nextest nextest run --profile ci --workspace-remap . \
  --archive-file "{{ config_root }}/target/nextest/workspace.tar.zst" \
  -E 'not binary(/^integration/)'
'''

[tasks.test-int-from-archive]
description = "Run the integration tests from the archive `test-archive` built"
run = '''
cargo-nextest nextest run --profile ci --workspace-remap . \
  --archive-file "{{ config_root }}/target/nextest/workspace.tar.zst" \
  --run-ignored all -E 'binary(/^integration/)'
'''

[tasks.test-int]
description = "Run the integration tests"
run = "cargo nextest run --workspace --features integration --locked --run-ignored all -E 'binary(/^integration/)'"

[tasks.audit]
description = "Run cargo-deny checks"
run = "cargo deny --all-features check"

[tasks.doc]
description = "Build docs with warnings as errors"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --all-features --no-deps"

[tasks.migrate]
description = "Run database migrations"
env = { TACTICA_RUN_MIGRATIONS = "true" }
run = "cargo run --bin tactica-api"

[tasks.build-docker]
description = "Build docker image for the API"
usage = """
arg "<bin>" help="The binary to build"
flag "--tag <tag>" help="The tag to build the docker image with" default="dev"
flag "--prefix <prefix>" help="The prefix to build the docker image with" default="git.hayden.moe/tactica/tactica"
"""
env.RUST_VERSION = { tools = true, value = "{{ tools.rust.version }}" }
run = """
docker build . \
  --build-arg BIN=${usage_bin} \
  --build-arg RUST_VERSION=${RUST_VERSION} \
  --file Dockerfile \
  --tag "${usage_prefix}/api:${usage_tag}" \
"""

[tasks.gen-jwt-keys]
description = "Generate JWT keys for the API"
run = """
rm -rf "{{ config_root }}/.local/jwt.key" "{{ config_root }}/.local/jwt.pem"
openssl genpkey -algorithm ed25519 -out "{{ config_root }}/.local/jwt.key"
openssl pkey -in "{{ config_root }}/.local/jwt.key" -pubout -out "{{ config_root }}/.local/jwt.pem"
"""
