[workspace]
resolver = "3"
members = [
  # service crates
  "api",
  "api/types",

  # db crates
  "db",
  "db/schema",
  "db/model",

  # utility crates
  "uuid-kinds", "auth",
]

[workspace.package]
rust-version = "1.98"
edition = "2024"
repository = "https://git.hayden.moe/tactica/tactica"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = [
  "cors",
  "limit",
  "request-id",
  "timeout",
  "trace",
] }
async-trait = "0.1"
thiserror = "2.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.26", features = ["v7"] }
utoipa = "5.5"
syn = "2.0"
proc-macro2 = "1.0"
quote = "1.0"
serde_tokenstream = "0.2"
diesel = { version = "2.3", features = ["chrono", "uuid"] }
diesel_migrations = { version = "2.3" }
diesel-async = { version = "0.9", features = ["postgres", "pool", "bb8"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
mockall = "0.15"
partial-struct = { git = "https://github.com/oxidecomputer/partial-struct" }
anyhow = "1.0"

tactica-api-types = { path = "api/types" }
tactica-db = { path = "db" }
tactica-db-schema = { path = "db/schema" }
tactica-db-model = { path = "db/model" }
tactica-uuid-kinds = { path = "uuid-kinds" }
