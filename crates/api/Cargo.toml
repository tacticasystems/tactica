[package]
name = "tactica-api"
version = "0.1.0"
license.workspace = true
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tactica-api"
path = "src/main.rs"

[features]
integration = []

[dependencies]
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
utoipa.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

tactica-api-types = { workspace = true, features = ["utoipa"] }
tactica-auth.workspace = true
tactica-db-schema = { workspace = true, features = ["migrations"] }
tactica-db-model.workspace = true
tactica-db.workspace = true
tactica-uuid-kinds.workspace = true
tactica-permissions.workspace = true

[dev-dependencies]
serde_json = "1.0"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "integration_auth_refresh"
path = "tests/auth_refresh.rs"
required-features = ["integration"]

[[test]]
name = "integration_rank_writes"
path = "tests/rank_writes.rs"
required-features = ["integration"]

[[test]]
name = "integration_role_writes"
path = "tests/role_writes.rs"
required-features = ["integration"]

[[test]]
name = "integration_unit_reads"
path = "tests/unit_reads.rs"
required-features = ["integration"]

[lints]
workspace = true
