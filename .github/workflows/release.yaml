---
name: Release containers

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Read release metadata
    if: startsWith(github.event.release.tag_name, 'tactica-api-v') || startsWith(github.event.release.tag_name, 'web-v')
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.release.outputs.component }}
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}
      rust-version: ${{ steps.release.outputs.rust-version }}
      node-version: ${{ steps.release.outputs.node-version }}
      pnpm-version: ${{ steps.release.outputs.pnpm-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Read component, version, and build tools
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          number = r"(?:0|[1-9][0-9]*)"
          identifiers = r"[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*"
          semver = rf"{number}\.{number}\.{number}(?:-{identifiers})?(?:\+{identifiers})?"
          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(rf"(tactica-api|web)-v({semver})", tag)
          if not match:
              raise SystemExit(f"Unsupported release tag: {tag}")

          component, version = match.groups()
          stable = "-" not in version.split("+", 1)[0] and os.environ["RELEASE_PRERELEASE"] == "false"
          with open(".mise/config.toml", "rb") as config:
              tools = tomllib.load(config)["tools"]
          outputs = {"component": component, "version": version, "stable": str(stable).lower()}
          required_tools = ("rust",) if component == "tactica-api" else ("node", "pnpm")
          outputs.update({f"{tool}-version": tools[tool] for tool in required_tools})
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY

  docker-api:
    name: Release API container
    needs: release
    if: needs.release.outputs.component == 'tactica-api'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      build-args: |
        BIN=tactica-api
        RUST_VERSION=${{ needs.release.outputs.rust-version }}
      cache: true
      cache-scope: api
      file: Dockerfile
      meta-images: ghcr.io/${{ github.repository }}-api
      meta-flavor: latest=false
      meta-tags: |
        type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.stable == 'true' }}
        type=raw,value=latest,enable=${{ needs.release.outputs.stable == 'true' }}
        type=raw,value=rolling,enable=${{ needs.release.outputs.stable == 'true' }}
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: "true"
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  docker-web:
    name: Release Web container
    needs: release
    if: needs.release.outputs.component == 'web'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      build-args: |
        NODE_VERSION=${{ needs.release.outputs.node-version }}
        PNPM_VERSION=${{ needs.release.outputs.pnpm-version }}
      cache: true
      cache-scope: web
      context: web
      file: docker/Dockerfile
      meta-images: ghcr.io/${{ github.repository }}-web
      meta-flavor: latest=false
      meta-tags: |
        type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.stable == 'true' }}
        type=raw,value=latest,enable=${{ needs.release.outputs.stable == 'true' }}
        type=raw,value=rolling,enable=${{ needs.release.outputs.stable == 'true' }}
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: "true"
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
