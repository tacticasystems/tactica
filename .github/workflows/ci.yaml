---
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.release-please-manifest.json'
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-audit:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Cargo Audit
    runs-on: ubuntu-26.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/workflows/setup-repo
        with:
          rust: true
          pnpm: false
      - name: Run audit
        run: mise run audit

  changes:
    if: >-
      ${{ github.event_name != 'push'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      web-only: ${{ steps.web.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed web files
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: web
        with:
          files: |
            .github/workflows/web.yaml
            web/**
          include_all_old_new_renamed_files: true

  rust-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/workflows/setup-repo
        with:
          rust: true
          pnpm: false

      - name: Check formatting
        run: mise run fmt-check

      - name: Run linter
        run: mise run clippy

      - name: Run doctests
        run: cargo test --doc --workspace --all-features --locked

  rust-build:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/workflows/setup-repo
        with:
          rust: true
          pnpm: false

      - name: Build and archive tests
        run: mise run test-archive

      - name: Upload workspace tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-workspace
          path: target/nextest/workspace.tar.zst
          retention-days: 1
          compression-level: 0

  rust-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Test
    needs: rust-build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/workflows/setup-repo
        with:
          rust: true
          pnpm: false

      - name: Download tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-workspace
          path: target/nextest

      - name: Run unit tests
        run: mise run test-from-archive

  integration-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Integration Tests
    needs: rust-build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/workflows/setup-repo
        with:
          rust: true
          pnpm: false

      - name: Download tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-workspace
          path: target/nextest

      - name: Run integration tests
        run: mise run test-int-from-archive

  web:
    name: Web
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.rust == 'true'
    needs: changes
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/web.yaml
    secrets:
      E2E_S3_ACCESS_KEY_ID: ${{ secrets.E2E_S3_ACCESS_KEY_ID }}
      E2E_S3_ENDPOINT: ${{ secrets.E2E_S3_ENDPOINT }}
      E2E_S3_SECRET_ACCESS_KEY: ${{ secrets.E2E_S3_SECRET_ACCESS_KEY }}

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - cargo-audit
      - changes
      - web
      - rust-build
      - rust-lint
      - rust-test
      - integration-test
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
