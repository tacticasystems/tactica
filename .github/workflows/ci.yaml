---
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.release-please-manifest.json'
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      run-e2e:
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-audit:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Cargo Audit
    runs-on: ubuntu-26.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/actions/setup-repo
        with:
          rust: true
          pnpm: false
      - name: Run audit
        run: mise run audit

  changes:
    if: >-
      ${{ github.event_name != 'push'
      && !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      web-only: ${{ steps.web.outputs.any_modified }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed web files
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: web
        with:
          files: |
            .github/workflows/web.yaml
            web/**
          include_all_old_new_renamed_files: true

  rust-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/actions/setup-repo
        with:
          rust: true
          pnpm: false

      - name: Check formatting
        run: mise run fmt-check

      - name: Run linter
        run: mise run clippy

      - name: Run doctests
        run: cargo test --doc --workspace --all-features --locked

  web-lint:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Web Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/actions/setup-repo
        with:
          rust: false
          pnpm: true

      - name: Check formatting
        run: mise run //web:fmt-check

      - name: Run linter
        run: mise run //web:lint

  web-build:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Web Build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/actions/setup-repo
        with:
          rust: false
          pnpm: true

      - name: Build the web app
        run: mise run //web:build

  web-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Web Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/actions/setup-repo
        with:
          rust: false
          pnpm: true

      - name: Run tests
        run: mise run //web:test

  web-e2e:
    if: ${{ inputs.run-e2e || false }}
    name: Web E2E tests
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: tactica_e2e
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d tactica_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_API: '1'
      E2E_DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/tactica_e2e
    strategy:
      fail-fast: false
      matrix:
        scale: [desktop, mobile]
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/actions/setup-repo
        with:
          rust: true
          pnpm: true

      - name: Prepare API build
        run: mise run build

      - name: Install browser and system dependencies
        run: pnpm --dir web exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: mise run //web:test-e2e --project=${{ matrix.browser }}-${{ matrix.scale }}

      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.browser }}-${{ matrix.scale }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
      - name: Upload Playwright results to R2
        id: r2
        if: >-
          ${{ !cancelled() && hashFiles('web/playwright-report/index.html') != '' &&
              (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.E2E_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          S3_ENDPOINT: ${{ secrets.E2E_S3_ENDPOINT }}
          S3_BUCKET: tactica-e2e-results
          REPORT_BASE_URL: https://playwright-test-results.tactica.systems
          PROJECT: ${{ matrix.browser }}-${{ matrix.scale }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Missing E2E_S3_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing E2E_S3_SECRET_ACCESS_KEY}"
          : "${S3_ENDPOINT:?Missing E2E_S3_ENDPOINT}"
          prefix="${GITHUB_RUN_ID}/${PROJECT}"
          aws s3 sync web/playwright-report/ "s3://${S3_BUCKET}/${prefix}/" \
            --endpoint-url "$S3_ENDPOINT" --no-progress --only-show-errors
          if [ -d web/test-results ]; then
            aws s3 sync web/test-results/ "s3://${S3_BUCKET}/${prefix}/test-results/" \
              --endpoint-url "$S3_ENDPOINT" --no-progress --only-show-errors
          fi
          echo "report-url=${REPORT_BASE_URL}/${prefix}/index.html" >> "$GITHUB_OUTPUT"
      - name: Comment report link
        if: ${{ !cancelled() && steps.r2.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_URL: ${{ steps.r2.outputs.report-url }}
          PROJECT: ${{ matrix.browser }}-${{ matrix.scale }}
          TEST_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = `<!-- playwright-report:${context.runId}:${process.env.PROJECT} -->`;
            const body = `${marker}\nPlaywright **${process.env.PROJECT}**: ${process.env.TEST_OUTCOME}\n\n[View HTML report](${process.env.REPORT_URL})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  rust-build:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/actions/setup-repo
        with:
          rust: true
          pnpm: false

      - name: Build and archive tests
        run: mise run test-archive

      - name: Upload workspace tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-workspace
          path: target/nextest/workspace.tar.zst
          retention-days: 1
          compression-level: 0

  rust-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Test
    needs: rust-build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/actions/setup-repo
        with:
          rust: true
          pnpm: false

      - name: Download tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-workspace
          path: target/nextest

      - name: Run unit tests
        run: mise run test-from-archive

  integration-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Integration Tests
    needs: rust-build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: ./.github/actions/setup-repo
        with:
          rust: true
          pnpm: false

      - name: Download tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-workspace
          path: target/nextest

      - name: Run integration tests
        run: mise run test-int-from-archive

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - cargo-audit
      - changes
      - rust-build
      - rust-lint
      - rust-test
      - integration-test
      - web-build
      - web-lint
      - web-test
      - web-e2e
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: |
          echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
