---
name: Web CI

on:
  workflow_call:
    secrets:
      E2E_S3_ACCESS_KEY_ID:
        required: false
      E2E_S3_ENDPOINT:
        required: false
      E2E_S3_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

jobs:
  audit:
    name: Audit web dependencies
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-repo
        with:
          rust: 'false'
          pnpm: 'true'
      - run: pnpm --dir web audit

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-repo
        with:
          rust: 'false'
          pnpm: 'true'
      - run: pnpm --dir web run lint

  fmt:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-repo
        with:
          rust: 'false'
          pnpm: 'true'
      - run: pnpm --dir web run fmt:check

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-repo
        with:
          rust: 'false'
          pnpm: 'true'
      - run: pnpm --dir web run test

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-repo
        with:
          rust: 'false'
          pnpm: 'true'
      - name: Install Chromium and system dependencies
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Run E2E tests
        id: e2e
        run: pnpm --dir web run test:e2e --project=${{ matrix.project }}
      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
      - name: Upload Playwright results to R2
        id: r2
        if: >-
          ${{ !cancelled() && hashFiles('web/playwright-report/index.html') != '' &&
              (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.E2E_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          S3_ENDPOINT: ${{ secrets.E2E_S3_ENDPOINT }}
          S3_BUCKET: tactica-e2e-results
          REPORT_BASE_URL: https://playwright-test-results.tactica.systems
          PROJECT: ${{ matrix.project }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Missing E2E_S3_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing E2E_S3_SECRET_ACCESS_KEY}"
          : "${S3_ENDPOINT:?Missing E2E_S3_ENDPOINT}"
          prefix="${GITHUB_RUN_ID}/${PROJECT}"
          aws s3 sync web/playwright-report/ "s3://${S3_BUCKET}/${prefix}/" \
            --endpoint-url "$S3_ENDPOINT" --no-progress --only-show-errors
          if [ -d web/test-results ]; then
            aws s3 sync web/test-results/ "s3://${S3_BUCKET}/${prefix}/test-results/" \
              --endpoint-url "$S3_ENDPOINT" --no-progress --only-show-errors
          fi
          echo "report-url=${REPORT_BASE_URL}/${prefix}/index.html" >> "$GITHUB_OUTPUT"
      - name: Comment report link
        if: ${{ !cancelled() && steps.r2.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_URL: ${{ steps.r2.outputs.report-url }}
          PROJECT: ${{ matrix.project }}
          TEST_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = `<!-- playwright-report:${context.runId}:${process.env.PROJECT} -->`;
            const body = `${marker}\nPlaywright **${process.env.PROJECT}**: ${process.env.TEST_OUTCOME}\n\n[View HTML report](${process.env.REPORT_URL})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-repo
        with:
          rust: 'false'
          pnpm: 'true'
      - run: pnpm --dir web run typecheck
      - run: pnpm --dir web run build

  versions:
    runs-on: ubuntu-26.04
    outputs:
      node-version: ${{ steps.versions.outputs.node-version }}
      pnpm-version: ${{ steps.versions.outputs.pnpm-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-repo
        with:
          rust: 'false'
      - id: versions
        run: |
          echo "node-version=$(mise tool node --active)" >> "$GITHUB_OUTPUT"
          echo "pnpm-version=$(mise tool pnpm --active)" >> "$GITHUB_OUTPUT"

  docker-web:
    name: Build Web container
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      build-args: |
        NODE_VERSION=${{ needs.versions.outputs.node-version }}
        PNPM_VERSION=${{ needs.versions.outputs.pnpm-version }}
      cache: true
      cache-scope: web
      context: web
      file: docker/Dockerfile
      meta-images: ghcr.io/${{ github.repository }}-web
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      platforms: linux/amd64,linux/arm64
      push: "${{ github.event_name == 'push' }}"
      sbom: "${{ github.event_name == 'push' }}"
      set-meta-annotations: true
      set-meta-labels: true
      sign: "${{ github.event_name == 'push' }}"
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
